[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    -v --tb=short
    # WEEK72: Activate when MultiAssetDataLoader is available in data/sources/
    --ignore=tests/test_multi_asset_data.py
    --ignore=tests/test_multi_asset_env.py
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    shape_verification: marks tests for tensor shape and NaN verification
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function