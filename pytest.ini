[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    -v --tb=short
    --ignore=tests/test_action_space.py
    --ignore=tests/test_advanced_networks.py
    --ignore=tests/test_basic.py
    --ignore=tests/test_live_trading.py
    --ignore=tests/test_live_trading_advanced.py
    --ignore=tests/test_multi_agent_integration.py
    --ignore=tests/test_multi_agent_multi_asset_integration.py
    --ignore=tests/test_multi_asset_data.py
    --ignore=tests/test_multi_asset_env.py
    --ignore=tests/test_paper_trading.py
    --ignore=tests/test_ppo_advantage_update.py
    --ignore=tests/test_realtime_data.py
    --ignore=tests/training/hyperopt/test_ray_hyperopt.py
    --ignore=tests/training/utils/test_ray_manager.py
    --ignore=tests/test_data_fetcher.py
    --ignore=tests/test_data_pipeline.py
    --ignore=tests/test_enhanced_backtester.py
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    shape_verification: marks tests for tensor shape and NaN verification
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function