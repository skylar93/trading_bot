[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    -v --tb=short
    # WEEK72: Activate when MultiAssetDataLoader is available in data/sources/
    --ignore=tests/test_multi_asset_data.py
    --ignore=tests/test_multi_asset_env.py
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    shape_verification: marks tests for tensor shape and NaN verification
    local_only: marks tests that require live exchange credentials; skipped in CI
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    # E15: Numeric correctness policy — RuntimeWarning from OUR code is a bug.
    # Third-party library warnings (numpy internals, scipy, torch) are exempted below.
    error::RuntimeWarning
    # scipy / numpy internals — not our code, not actionable
    ignore::RuntimeWarning:scipy.*
    ignore::RuntimeWarning:numpy.*
    ignore::RuntimeWarning:torch.*
    ignore::RuntimeWarning:sklearn.*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function