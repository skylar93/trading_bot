# Single Agent Configuration
# This file configures a single agent trading in a single asset environment

# Environment configuration
env:
  type: single_asset_rl  # Environment type for single-asset single-agent
  window_size: 30        # Observation window size
  initial_balance: 10000 # Starting balance for the agent
  trading_fee: 0.001     # 0.1% trading fee
  reward_scaling: 1.0    # Reward scaling factor
  max_position_size: 1.0 # Maximum position size as a fraction of balance
  reward_function: sharpe_ratio  # Use Sharpe ratio as reward
  action_type: continuous  # Use continuous actions (-1 to 1)
  include_technical_indicators: true  # Include technical indicators in observation
  risk_adjusted: true    # Apply risk adjustment to rewards
  realistic_slippage: true  # Apply realistic slippage model
  
  # Technical indicators to include
  indicators:
    - name: "RSI"
      window: 14
    - name: "MACD"
      fast_window: 12
      slow_window: 26
      signal_window: 9
    - name: "Bollinger"
      window: 20
      dev: 2

# Agent configuration
agent_type: ppo  # Use PPO agent
agent:
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  batch_size: 64
  n_epochs: 10
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: false
  sde_sample_freq: -1
  target_kl: null
  policy_kwargs:
    net_arch:
      pi: [64, 64]
      vf: [64, 64]
  normalize_advantage: true
  normalize_observations: true

# Training parameters
training:
  total_timesteps: 1000000
  eval_interval: 10000
  checkpoint_interval: 20000
  log_interval: 100
  n_eval_episodes: 5
  random_seed: 42
  tensorboard_log: ./logs/single_agent_tensorboard/
  device: auto  # Use "cpu" or "cuda" or "auto"

# Paths for saved models and logs
paths:
  checkpoint_dir: checkpoints/single_agent
  log_dir: logs/single_agent
  data_dir: data

# Data configuration
data:
  file_path: test_data.csv
  train_test_split: 0.8
  column_map:
    open: $open
    high: $high
    low: $low
    close: $close
    volume: $volume 