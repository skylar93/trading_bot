# Regime Detection Configuration
regime_detector:
  n_regimes: 3          # bull, bear, sideways
  lookback: 60          # rows of data for prediction window
  vol_window: 20        # rolling window for volatility estimate
  n_iter: 100           # EM iterations for HMM fitting
  random_state: 42

# Regime labels (sorted by mean return after fit)
labels:
  0: bear
  1: sideways
  2: bull
