env:
  type: "single_asset_rl"         # or "multi_agent_rl"
  initial_balance: 10000.0
  trading_fee: 0.001
  window_size: 20
  normalize: true
  stack_size: 4
  max_position_size: 1.0
  # Additional multi-agent specific settings
  multi_agent_configs:
    - id: "momentum_agent"
      type: "Momentum"
      initial_capital_percentage: 0.5  # Percentage of total capital
      priority: 1                     # Decision priority (lower executes first)
      hyperparameters:
        learning_rate: 3e-4
        gamma: 0.99
        clip_epsilon: 0.2
    - id: "mean_reversion_agent"
      type: "MeanReversion"
      initial_capital_percentage: 0.5
      priority: 2
      hyperparameters:
        learning_rate: 2e-4
        gamma: 0.98
        clip_epsilon: 0.2

data:
  exchange: "binance"
  symbols: ["BTC/USDT"]  # Can be extended for multi-asset: ["BTC/USDT", "ETH/USDT"]
  timeframe: "1h"
  start_date: "2023-01-01"
  end_date: "2023-12-31"
  # Chronological split ratios (must sum to 1.0)
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  min_rows: 50                    # Minimum rows required for validation
  cache_dir: "data/raw"
  data_path: "data/BTC_1h.csv"  # Direct file path if pre-processed data exists

decision_transformer:
  # --- Model architecture ---
  state_dim: 100          # window_size(20) × n_features(5); update if obs changes
  act_dim: 1              # scalar continuous position action
  hidden_size: 128        # transformer embedding dimension
  context_len: 20         # K timesteps per context window
  n_layer: 3              # transformer depth
  n_head: 1               # attention heads (hidden_size must be divisible)
  n_inner: null           # FFN dim; null → 4×hidden_size
  dropout: 0.1

  # --- Backbone ---
  use_gpt2_backbone: false  # true → download GPT-2 weights; false → lightweight custom transformer
  use_lora: true            # LoRA adapters (only relevant when use_gpt2_backbone=true)
  lora_rank: 16
  lora_alpha: 32.0
  lora_dropout: 0.1

  # --- Training ---
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 1000
  max_grad_norm: 0.25
  batch_size: 64
  n_epochs: 10
  device: "cpu"

  # --- Inference ---
  target_return: 1.0        # RTG target used when rolling out with DT (normalised)
  checkpoint_dir: "checkpoints/decision_transformer"
  trajectory_save_path: "data/expert_trajectories.pkl"

sentiment:
  enabled: false                          # set true to use FinBERT features
  model_name: "ProsusAI/finbert"
  max_length: 128
  batch_size: 32
  cache_db: "data_cache/sentiment_cache.sqlite"
  device: "cpu"
  extreme_threshold: 0.7                  # |pos-neg| above this = extreme headline
  news_data_path: null                    # path to news CSV for backtesting

feature_engineering:
  use_rsi: true
  use_macd: true
  use_bollinger: true
  use_atr: true
  use_obv: true
  use_vwap: true
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2.0
  atr_period: 14
  enabled_features: ["rsi", "macd", "bb_width", "atr", "obv", "vwap_dev"]

agent:
  name: "PPO"  # Agent type for single-agent mode
  # Base PPO parameters
  learning_rate: 3e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_coef: 1.0  # c1 in the original config
  entropy_coef: 0.01  # c2 in the original config
  loss_coef: 0.5  # c3 in the original config
  batch_size: 64
  n_epochs: 10
  target_kl: 0.015
  # Network architecture
  fcnet_hiddens: [64, 64]
  activation: "tanh"  # or "relu", "leaky_relu", etc.
  use_lstm: false
  lstm_size: 128  # Only used if use_lstm is true

training:
  total_timesteps: 100000
  checkpoint_interval: 10000
  eval_interval: 5000
  use_gpu: true
  device: "cuda:0"  # or "cpu", specific GPU index
  seed: 42
  early_stop_patience: 20
  tensorboard_log: true
  log_level: "INFO"
  
  # For distributed training
  num_workers: 4
  parallel_envs: 1  # Number of environments to run in parallel per worker
  rollout_fragments: 200  # Number of steps per rollout fragment

paths:
  model_dir: "models"
  data_dir: "data"
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
  mlflow_tracking_uri: "mlruns"
  hyperopt_results_dir: "hyperopt_results"

hpc:
  use_hpc: false  # Set to true for UW Hyak HPC mode
  scheduler: "slurm"  # Or other HPC job scheduler
  partition: "gpu-a40"  # Hyak partition name
  account: "your_account"  # Your allocation account
  nodes: 1
  ntasks_per_node: 1
  cpus_per_task: 4
  gpus_per_node: 1
  memory: "48G"
  time: "24:00:00"  # Wall time limit in hours
  job_name: "trading_bot_training"
  output: "logs/slurm-%j.out"
  email: ""  # Your email for job notifications
  
  # Ray cluster settings
  ray_head_memory: "16G"
  ray_worker_memory: "12G"
  ray_object_store_memory: "8G"
  ray_num_workers: 4

hyperopt:
  framework: "ray"  # or "optuna", "hyperopt"
  num_samples: 50  # Number of trials to run
  max_concurrent_trials: 4  # Maximum number of trials to run in parallel
  search_algorithm: "random"  # or "bayesian", "pbt", "bohb"
  metric: "mean_reward"  # Metric to optimize
  mode: "max"  # Optimization direction
  # Parameter search space (example for PPO agent)
  parameters:
    agent.learning_rate:
      distribution: "loguniform"
      min: 1e-5
      max: 1e-3
    agent.gamma:
      distribution: "uniform"
      min: 0.9
      max: 0.999
    agent.clip_epsilon:
      distribution: "uniform"
      min: 0.1
      max: 0.3
    # Add more parameters as needed 
# ---------------------------------------------------------------------------
# Week 15: Meta-Controller + Prediction Market Signals
# ---------------------------------------------------------------------------

meta_controller:
  enabled: false                  # set true to use learned weighting
  n_regimes: 3                    # must match regime detector output
  n_market_features: 4            # extra features (e.g. prediction-market)
  hidden_dim: 64                  # MLP width
  lr: 3.0e-4
  gamma: 0.99
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  ppo_epochs: 4
  mini_batch_size: 32
  rebalance_interval: 20          # env steps between PPO updates
  min_weight: 0.05                # floor weight per agent
  emergency_window: 5             # consecutive neg-Sharpe periods → all-cash

# ---------------------------------------------------------------------------
# Week 21: GTrXL Feature Extractor + Almgren-Chriss Market Impact
# ---------------------------------------------------------------------------

feature_extractor:
  type: "mlp"              # "mlp" | "lstm" | "cnn" | "gtrxl"
  # GTrXL-specific settings (active when type == "gtrxl")
  gtrxl:
    features_dim: 128      # output feature dimension
    n_layers: 3            # number of GTrXL layers
    d_model: 128           # internal transformer dimension (must be divisible by n_heads)
    n_heads: 4             # attention heads
    memory_len: 64         # Transformer-XL memory segments (0 = disabled)
    gate_type: "gru"       # gating mechanism; only "gru" supported
    dropout: 0.0           # attention dropout

market_impact:
  enabled: false           # set true to use Almgren-Chriss instead of linear slippage
  model: "sqrt"            # "linear" | "sqrt"
  # Square-root model params
  sigma: 0.02              # intraday volatility (fraction, e.g. 0.02 = 2%)
  kappa: 0.5               # scaling constant (empirical; tune per asset)
  # Linear model params (ignored when model == "sqrt")
  eta: 0.01                # temporary impact coefficient
  gamma: 0.001             # permanent impact coefficient

# ---------------------------------------------------------------------------
# Week 22: DTForecaster + Agent Communication Protocol
# ---------------------------------------------------------------------------

dt_forecaster:
  enabled: false           # set true to attach DTForecaster to env observation
  # Architecture
  state_dim: 5             # input features per timestep (5 = raw OHLCV)
  seq_len: 20              # must match env.window_size
  hidden_size: 64          # transformer embedding dimension
  n_layer: 2               # number of causal transformer blocks
  n_head: 4                # attention heads (hidden_size must be divisible)
  dropout: 0.1             # dropout rate (also used for MC-dropout confidence)
  # Training
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  batch_size: 64
  n_epochs: 20
  w_5step: 0.5             # weight of 5-step head in combined MSE loss
  val_frac: 0.1            # fraction of data for walk-forward validation
  # Inference
  mc_samples: 10           # MC-dropout passes for confidence estimation
  checkpoint_dir: "checkpoints/dt_forecaster"

agent_communication:
  enabled: false           # set true to enable CommunicationBus intention sharing
  # Each sub-agent publishes: direction (-1..1), confidence (0..1),
  #   horizon (steps, int), risk_assessment (0..1)
  # Aggregated features (n_agents * 4) are fed to the MetaController input
  feed_to_meta_controller: true   # extend meta-controller obs with intention features
  # MetaController must also have use_intention: true (see meta_controller section above)

# ---------------------------------------------------------------------------
# Week 23: Continual Learning Pipeline (EWC + AdaptiveTrainer)
# ---------------------------------------------------------------------------

continual_learning:
  enabled: true

  # Retraining control
  min_retrain_interval_s: 86400   # minimum 1 day between auto-retrains
  fine_tune_timesteps: 10000      # SB3 .learn() timesteps per retrain cycle
  validation_folds: 3             # walk-forward folds for acceptance check
  rollback_threshold: 0.90        # new Sharpe >= baseline * threshold to accept

  # EWC regularisation
  ewc_lambda: 0.4                 # regularisation strength (0 = disabled)
  n_fisher_samples: 512           # transitions for diagonal Fisher estimation

  # Experience store
  obs_dim: 100                    # flattened obs dim (window_size × n_features)
  act_dim: 1
  max_size_per_regime: 50000      # max transitions stored per regime
  n_regimes: 3                    # must match regime_detection.n_regimes
  current_regime_ratio: 0.70      # fraction of batch from current regime

  # Checkpointing
  checkpoint_dir: "checkpoints/adaptive"
  mlflow_experiment: "adaptive_retraining"

# ---------------------------------------------------------------------------
# Week 23: TorchRL FLAG Adapter (async batch inference)
# ---------------------------------------------------------------------------

torchrl:
  enabled: false                  # set true when torchrl>=0.11.0 is installed
  max_batch_size: 16              # max obs per async batch forward pass
  flush_interval_s: 0.01         # max wait before flushing partial batch

prediction_market:
  enabled: false                  # set true to add prediction-market features
  providers:
    - "polymarket"
    - "kalshi"
  cache_db: "data_cache/prediction_market_cache.sqlite"
  cache_ttl: 300                  # seconds
  momentum_window: 5              # steps for prob_momentum feature
  timeout: 5.0                    # HTTP timeout (seconds)
  features:
    - "primary_event_prob"
    - "event_prob_momentum"
    - "event_uncertainty"
    - "cross_market_divergence"
  asset_keywords:
    BTC:  ["bitcoin", "btc", "crypto"]
    ETH:  ["ethereum", "eth", "crypto"]
    SPY:  ["fed", "rate", "recession"]
    GLD:  ["gold", "inflation", "fed"]
    DEFAULT: ["recession", "fed rate"]

# ---------------------------------------------------------------------------
# Week 20: Lagrangian CVaR-PPO + Concept Drift Detection
# ---------------------------------------------------------------------------

cvar:
  mode: "lagrangian"          # "lagrangian" | "callback"
                              # lagrangian: CVaR in loss function (CVaRPPO)
                              # callback:   soft constraint via CvarCallback (fallback)
  alpha: 0.05                 # tail probability — worst 5% of returns
  threshold: -0.02            # min acceptable CVaR (tail mean ≥ -2%)
  lr_nu: 0.01                 # dual-variable step size
  nu_max: 10.0                # hard upper bound on dual variable ν

drift_detection:
  enabled: true
  method: "adwin"             # "adwin" | "page_hinkley"
  # ADWIN settings
  adwin_confidence: 0.002     # δ — smaller → fewer false positives, slower detection
  # Page-Hinkley settings (used when method="page_hinkley")
  ph_delta: 0.005             # allowed mean fluctuation
  ph_threshold: 50.0          # detection threshold λ
  # Reaction settings
  cooldown_steps: 1000        # min steps between two drift reactions
  checkpoint_on_drift: true   # save model checkpoint when drift detected
  conservative_scale: null    # action scale after drift (null = no scaling)


# ---------------------------------------------------------------------------
# Week 26: On-Chain Metrics + Calendar Features + Correlation Discovery
# ---------------------------------------------------------------------------

onchain:
  enabled: false              # set true to include on-chain features (+10 obs dims)
  symbol: "BTC"
  coingecko_id: "bitcoin"
  ccxt_exchange: "binance"
  ccxt_symbol: "BTC/USDT:USDT"
  cache_db: "data/cache/onchain_cache.db"
  cache_ttl_seconds: 3600
  use_coingecko: true
  use_ccxt_derivatives: true
  rolling_window: 30

calendar:
  enabled: true               # lightweight — no external API, always safe to enable
  event_lookahead_days: 3     # days ahead to flag FOMC/CME expiry
  month_end_decay: 0.3        # proximity decay rate for month-end
  quarter_end_decay: 0.2
  include_halving_cycle: true

correlation_discovery:
  enabled: false              # set true to run analysis as a post-training step
  max_lag: 20
  granger_max_lag: 10
  significance_level: 0.05
  top_k_pairs: 20
  min_correlation: 0.1
  output_dir: "reports/correlation"
  log_to_mlflow: false
  use_mutual_info: true
  stability_window: 60
