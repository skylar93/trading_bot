env:
  type: "single_asset_rl"         # or "multi_agent_rl"
  initial_balance: 10000.0
  trading_fee: 0.001
  window_size: 20
  normalize: true
  stack_size: 4
  max_position_size: 1.0
  # Additional multi-agent specific settings
  multi_agent_configs:
    - id: "momentum_agent"
      type: "Momentum"
      initial_capital_percentage: 0.5  # Percentage of total capital
      priority: 1                     # Decision priority (lower executes first)
      hyperparameters:
        learning_rate: 3e-4
        gamma: 0.99
        clip_epsilon: 0.2
    - id: "mean_reversion_agent"
      type: "MeanReversion"
      initial_capital_percentage: 0.5
      priority: 2
      hyperparameters:
        learning_rate: 2e-4
        gamma: 0.98
        clip_epsilon: 0.2

data:
  exchange: "binance"
  symbols: ["BTC/USDT"]  # Can be extended for multi-asset: ["BTC/USDT", "ETH/USDT"]
  timeframe: "1h"
  start_date: "2023-01-01"
  end_date: "2023-12-31"
  train_test_split: 0.8  # 80% training, 20% testing
  cache_dir: "data/raw"
  data_path: "data/BTC_1h.csv"  # Direct file path if pre-processed data exists

agent:
  name: "PPO"  # Agent type for single-agent mode
  # Base PPO parameters
  learning_rate: 3e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_coef: 1.0  # c1 in the original config
  entropy_coef: 0.01  # c2 in the original config
  loss_coef: 0.5  # c3 in the original config
  batch_size: 64
  n_epochs: 10
  target_kl: 0.015
  # Network architecture
  fcnet_hiddens: [64, 64]
  activation: "tanh"  # or "relu", "leaky_relu", etc.
  use_lstm: false
  lstm_size: 128  # Only used if use_lstm is true

training:
  total_timesteps: 100000
  checkpoint_interval: 10000
  eval_interval: 5000
  use_gpu: true
  device: "cuda:0"  # or "cpu", specific GPU index
  seed: 42
  early_stop_patience: 20
  tensorboard_log: true
  log_level: "INFO"
  
  # For distributed training
  num_workers: 4
  parallel_envs: 1  # Number of environments to run in parallel per worker
  rollout_fragments: 200  # Number of steps per rollout fragment

paths:
  model_dir: "models"
  data_dir: "data"
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
  mlflow_tracking_uri: "mlruns"
  hyperopt_results_dir: "hyperopt_results"

hpc:
  use_hpc: false  # Set to true for UW Hyak HPC mode
  scheduler: "slurm"  # Or other HPC job scheduler
  partition: "gpu-a40"  # Hyak partition name
  account: "your_account"  # Your allocation account
  nodes: 1
  ntasks_per_node: 1
  cpus_per_task: 4
  gpus_per_node: 1
  memory: "48G"
  time: "24:00:00"  # Wall time limit in hours
  job_name: "trading_bot_training"
  output: "logs/slurm-%j.out"
  email: ""  # Your email for job notifications
  
  # Ray cluster settings
  ray_head_memory: "16G"
  ray_worker_memory: "12G"
  ray_object_store_memory: "8G"
  ray_num_workers: 4

ensemble:
  enabled: false                  # Set true to use EnsembleManager instead of single agent
  method: "rolling_validation"   # rolling_validation | weighted_average | best
  rebalance_interval: 1000       # steps between weight rebalancing
  validation_window: 200         # episode returns kept per agent for Sharpe calc
  softmax_temperature: 1.0
  agents:
    - id: "ppo_conservative"
      type: "sb3_ppo"
      risk_profile: "conservative"
      weight_init: 0.4
      params:
        ent_coef: 0.005
        clip_range: 0.1
        learning_rate: 0.0003
        n_steps: 2048
    - id: "sac_moderate"
      type: "sb3_sac"
      risk_profile: "moderate"
      weight_init: 0.35
      params:
        ent_coef: "auto"
        learning_rate: 0.0003
    - id: "td3_aggressive"
      type: "sb3_td3"
      risk_profile: "aggressive"
      weight_init: 0.25
      params:
        learning_rate: 0.001
        policy_delay: 2

regime:
  enabled: false               # Set true to attach RegimeDetector to env + ensemble
  method: "hmm"                # "hmm" (GaussianHMM) or "threshold" (volatility percentile)
  n_states: 3                  # Number of HMM hidden states (maps to low/medium/high vol)
  vol_window: 20               # Rolling volatility window for threshold detector
  n_iter: 100                  # HMM EM iterations
  covariance_type: "diag"      # HMM covariance: "diag" (faster) or "full"
  fallback_on_error: true      # Fall back to threshold if HMM inference fails
  random_state: 42
  # Weight multipliers by risk_profile per regime (applied before re-normalising)
  # regime 0 = low_vol/trending, 1 = medium_vol/ranging, 2 = high_vol/crisis
  weight_multipliers:
    low_vol:
      conservative: 1.5
      moderate: 1.0
      aggressive: 0.5
    medium_vol:
      conservative: 1.0
      moderate: 1.0
      aggressive: 1.0
    high_vol:
      conservative: 0.8
      moderate: 1.5
      aggressive: 0.3

risk:
  # ── CVaR (Conditional Value at Risk) constraint (Week 9) ─────────────────
  cvar_enabled: false           # master switch; set true to attach CVaRCallback
  cvar_alpha: 0.05              # tail probability (0.05 = worst 5% of rewards)
  cvar_threshold: -0.02         # max acceptable CVaR; values below trigger penalty
  penalty_scale: 2.0            # divisor for rollout advantages/returns on violation
  ent_coef_scale: 2.0           # ent_coef multiplier on violation; decays when satisfied
  max_ent_coef: 0.1             # hard ceiling on entropy coefficient
  use_lagrangian: false         # enable Lagrangian dual variable (dual ascent)
  lagrangian_lr: 0.01           # learning rate for Lagrangian update
  log_interval: 1               # log every N rollout-ends (on-policy) / CVaR checks

validation:
  method: "walk_forward"          # "walk_forward" | "holdout" | "kfold"
  train_window: 252               # rows in training slice (≈1 trading year at daily)
  val_window: 63                  # rows in validation slice (≈1 quarter)
  test_window: 21                 # rows in OOS test slice (≈1 month)
  step_size: 21                   # rows to advance between folds (≈1 month)
  total_timesteps_per_fold: 10000 # SB3 timesteps per fold (override training.total_timesteps)
  # Stability rating thresholds (OOS Sharpe / IS Sharpe)
  #   >= 0.7 → "strong"
  #   >= 0.5 → "decent"
  #   >= 0.3 → "marginal"
  #   <  0.3 → "overfitting"

hyperopt:
  # ── Optuna settings (Week 8 rebuild) ────────────────────────────────────
  enabled: false
  n_trials: 50                    # total Optuna trial budget
  n_startup_trials: 10            # random trials before TPE warms up
  multi_objective: false          # true → Pareto (Sharpe + max_drawdown)
  timeout: null                   # wall-clock budget in seconds (null = unlimited)
  study_name: "trading_hyperopt"
  eval_episodes: 3                # episodes per trial evaluation
  trial_timesteps: 10000          # SB3 timesteps per trial (overrides training.total_timesteps)
  train_ratio: 0.7                # fraction of data used for within-trial training
  metric: "oos_sharpe"            # optimisation target (for logging)

  # ── Parameter search space ────────────────────────────────────────────────
  # Override default ranges by providing min/max (or values for categorical).
  # Any key absent here uses the defaults in hyperopt_optuna._suggest_params().
  parameters:
    learning_rate:
      min: 1.0e-4
      max: 1.0e-3
    n_steps:
      values: [1024, 2048, 4096]
    batch_size:
      values: [32, 64, 128, 256]
    n_epochs:
      min: 3
      max: 15
    gamma:
      min: 0.95
      max: 0.999
    gae_lambda:
      min: 0.9
      max: 0.99
    ent_coef:
      min: 1.0e-3
      max: 0.1
    clip_range:
      min: 0.1
      max: 0.3
    vf_coef:
      min: 0.25
      max: 1.0
    max_grad_norm:
      values: [0.3, 0.5, 0.7, 1.0]
    feature_extractor:
      values: ["conv1d", "lstm", "mlp"]
    reward_weights.pnl:
      min: 0.2
      max: 0.5
    reward_weights.sharpe:
      min: 0.1
      max: 0.4

  # ── Legacy Ray Tune settings (kept for backward compatibility) ────────────
  framework: "optuna"
  num_samples: 50
  max_concurrent_trials: 4 