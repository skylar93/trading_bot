data:
  end_date: '2023-12-31'
  exchange: binance
  start_date: '2023-01-01'
  symbols:
  - BTC/USDT
  timeframe: 1h
env:
  type: "single_asset_rl"
  window_size: 10
  initial_balance: 10000
  trading_fee: 0.001
  max_position_size: 1.0

agent:
  type: "ppo"
  learning_rate: 0.0003
  hidden_dim: 64
  n_layers: 2
  batch_size: 64
  clip_ratio: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 10000  # 작은 수로 시작
  checkpoint_interval: 1000
  eval_interval: 500
  log_interval: 100

paths:
  checkpoint_dir: "checkpoints"
  data_dir: "data"
  log_dir: "logs"
