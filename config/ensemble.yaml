# Ensemble Configuration
# 4-agent ensemble: PPO (conservative) + SAC (moderate) + TD3 (aggressive) + FLAG-Trader (LLM)

agents:
  - type: ppo
    role: conservative
    weight_init: 0.30
    config_path: config/single_agent.yaml

  - type: sac
    role: moderate
    weight_init: 0.25
    config_path: config/sac.yaml

  - type: td3
    role: aggressive
    weight_init: 0.20
    config_path: config/td3.yaml

  - type: flag_trader
    role: llm_guided
    weight_init: 0.25
    config_path: config/flag_trader.yaml

meta_controller:
  n_regimes: 3
  n_market_features: 4
  hidden_dim: 64
  lr: 3.0e-4
  rebalance_interval: 20
  min_weight: 0.05
  emergency_window: 5

ood_detector:
  latent_dim: 16
  hidden_dim: 128
  threshold_percentile: 95.0

walk_forward:
  n_splits: 12
  train_ratio: 0.5
  gap_days: 5
  mode: expanding
