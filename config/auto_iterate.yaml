# Automated Strategy Iteration Configuration
# Week 18: AutoStrategyIterator — Claude-powered strategy discovery loop

auto_iterate:
  # --- Loop control ---------------------------------------------------
  max_iterations: 20              # hard cap (guard rail)
  max_training_minutes: 30        # per-iteration training budget hint

  # --- Stagnation detection -------------------------------------------
  stagnation_window: 3            # consecutive iterations with <threshold improvement
  stagnation_threshold: 0.05      # 5% Sharpe improvement required to avoid stagnation

  # --- Strategist (LLM-powered proposal) ------------------------------
  use_claude: false               # true → Anthropic API; false → rule-based perturb
  claude_model: "claude-haiku-4-5-20251001"  # lightweight / fast for proposals

  # --- MLflow ---------------------------------------------------------
  mlflow_experiment: "auto_strategy_iteration"

  # --- Dev / test flags -----------------------------------------------
  dry_run: false                  # true → mock evaluate_fn, no training
  seed: 42
  log_interval: 5


# --- Seed strategy (starting point for exploration) -------------------
seed_strategy:
  agent_type: "ppo"               # one of: ppo, sac, td3, flag
  window_size: 20
  training_timesteps: 50000
  reward_weights:
    pnl: 0.6
    risk: 0.3
    holding: 0.1
  feature_set:
    - "returns"
    - "volume"
    - "rsi"
    - "macd"


# --- Evaluation (production) ----------------------------------------
# The evaluate_fn is injected at runtime; these are passed via StrategyConfig
evaluation:
  initial_capital: 10000.0
  trading_fee: 0.001
  walk_forward_folds: 5           # folds for stability_ratio computation
  min_bars: 500                   # minimum bars required for a valid backtest


# --- Output -----------------------------------------------------------
output:
  save_ranked_results: true
  output_dir: "artifacts/strategy_lab"
  top_k: 5                        # keep top-K configs in output report
