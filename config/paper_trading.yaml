# Paper Trading Configuration
# Used by deployment/paper_trader.py

paper_trading:
  symbol: "BTC/USDT"
  exchange_id: "binance"           # CCXT exchange identifier
  initial_balance: 10000.0         # Starting capital (USD)
  trading_fee: 0.001               # 0.1% per trade
  max_position_size: 1.0           # Max fraction of balance in a single position
  max_drawdown_threshold: 0.20     # Shutdown if drawdown exceeds 20%
  window_size: 20                  # Observation window (price history bars)
  poll_interval_seconds: 5.0       # Live price polling interval
  daily_report_interval: 86400     # Seconds between daily reports (86400 = 1 day)

  # Exchange API credentials — resolved via SecretProvider at runtime.
  # Set EXCHANGE_BINANCE_KEY / EXCHANGE_BINANCE_SECRET env vars (or equivalent
  # for the chosen backend).  Leave both _ref fields empty to run in
  # simulation mode (no live exchange connection).
  api_key_ref: "EXCHANGE_BINANCE_KEY"
  api_secret_ref: "EXCHANGE_BINANCE_SECRET"

# Agent to run
agent:
  algo: "PPO"                      # PPO | SAC | TD3
  checkpoint: ""                   # Path to trained model .zip file

# MLflow tracking
mlflow:
  enabled: true
  experiment_name: "paper_trading"
  tracking_dir: "./mlruns"

# LLM Review Panel (runs after each session)
llm_review:
  enabled: false                   # Set true to auto-review after each session
  model: "claude-opus-4-6"
  dry_run: false
  max_weight_change: 0.05
  reward_weights:
    pnl: 0.35
    sharpe: 0.25
    downside_risk: 0.15
    drawdown: 0.15
    transaction_cost: 0.10
