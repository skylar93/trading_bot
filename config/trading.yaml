# ============================================================
# config/trading.yaml — 거래 환경 & 실행 설정
# Week 63: Config Consolidation
#
# base.yaml 위에 deep_merge됨.
# 거래소 실행 경로, 주문 관리, 포지션 관련 설정.
# ============================================================

# ── 거래 환경 세부 설정 ────────────────────────────────────────
trading:
  initial_balance: 100000.0
  window_size: 20
  features:
    - "close"
    - "open"
    - "high"
    - "low"
    - "volume"
  observation_space:
    type: "box"
    normalize: true
  action_space:
    type: "discrete"
    positions: [-1, 0, 1]  # short, flat, long

# ── 주문 실행 ─────────────────────────────────────────────────
execution:
  # exchange_mode: "paper" | "sandbox" | "live"  (기본값: paper, 안전)
  # sandbox: Binance testnet 등 거래소 테스트넷에 실제 WebSocket 연결
  # live:    실 거래소 연결 (G11 Go-Live 체크리스트 통과 후에만)
  exchange_mode: "paper"
  paper_mode: true          # exchange_mode 설정 시 자동 override됨 (하위 호환)
  exchange_id: "binance"
  symbol: "BTC/USDT"
  timeframe: "1m"
  max_order_size: 0.1
  daily_loss_limit: -500.0
  initial_cash: 100000.0
  rate_limit_calls: 10
  rate_limit_period: 1.0
  heartbeat_timeout: 60.0  # seconds; CCXTAdapter watchdog threshold

# ── 리워드 & 마찰 ──────────────────────────────────────────────
reward:
  sharpe_weight: 1.0
  drawdown_penalty: 0.5
  friction:
    slippage: 0.001
    partial_fills: false

# ── 멀티에이전트 설정 ─────────────────────────────────────────
# (multi-agent / multi-asset 실행 시 이 섹션 오버라이드)
multi_agent:
  enabled: false
  use_manager: false
  ensemble_method: "weighted_vote"
  assets: ["BTC/USDT"]
  shared_experience:
    enabled: false
    buffer_size: 100000
  portfolio_constraints:
    max_concentration: 0.5
    min_cash_reserve: 0.05
