name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Unit + regression tests with coverage
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio

    - name: Run unit tests with coverage
      run: |
        pytest tests/ \
          --ignore=tests/test_full_integration.py \
          -v --tb=short \
          --cov=agents --cov=training --cov=envs --cov=risk_management --cov=deployment \
          --cov-report=term-missing \
          --cov-report=xml:coverage.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: coverage.xml
        fail_ci_if_error: false

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          coverage.xml
        retention-days: 14

    - name: Test Summary
      if: always()
      uses: test-summary/action@v2
      with:
        paths: "coverage.xml"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Full end-to-end integration test (Week 24)
  # ──────────────────────────────────────────────────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-3.10-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-3.10-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio

    - name: Run full integration test suite
      run: |
        pytest tests/test_full_integration.py -v --tb=short

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Lint (black + isort — flake8 advisory only)
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install lint tools
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8

    - name: black (format check)
      run: black --check --diff .

    - name: isort (import order check)
      run: isort --check-only --diff .

    - name: flake8 (advisory — non-blocking)
      run: flake8 . --max-line-length=120 --extend-ignore=E203,W503 || true

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Staging deploy (develop branch only)
  # ──────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    needs: [test, integration, lint]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Paper trading smoke test (100 steps)
      run: python scripts/smoke_test.py --steps 100 --timesteps 512

    - name: Upload model artifact to staging
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
      run: |
        if [ -n "$AWS_ACCESS_KEY_ID" ]; then
          pip install awscli
          aws s3 cp . s3://${{ secrets.STAGING_BUCKET }}/trading-bot/latest/ \
            --recursive \
            --exclude "*.pyc" \
            --exclude ".git/*" \
            --exclude ".claude/*" \
            --exclude "logs/*" \
            --quiet
          echo "Staging artifact uploaded"
        else
          echo "AWS credentials not configured — skipping artifact upload"
        fi

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5: Production deploy (main branch only)
  # ──────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    needs: [test, integration, lint]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Full integration test (pre-deploy gate)
      run: |
        pytest tests/test_full_integration.py -v --tb=short

    - name: Paper trading smoke test (pre-deploy verification)
      run: python scripts/smoke_test.py --steps 100 --timesteps 512

    - name: Upload model artifact to production
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
      run: |
        if [ -n "$AWS_ACCESS_KEY_ID" ]; then
          pip install awscli
          DEPLOY_TAG=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}
          aws s3 cp . s3://${{ secrets.PROD_BUCKET }}/trading-bot/${DEPLOY_TAG}/ \
            --recursive \
            --exclude "*.pyc" \
            --exclude ".git/*" \
            --exclude ".claude/*" \
            --exclude "logs/*" \
            --quiet
          aws s3 sync \
            s3://${{ secrets.PROD_BUCKET }}/trading-bot/${DEPLOY_TAG}/ \
            s3://${{ secrets.PROD_BUCKET }}/trading-bot/latest/ \
            --quiet
          echo "Production artifact deployed: ${DEPLOY_TAG}"
        else
          echo "AWS credentials not configured — skipping artifact upload"
        fi
